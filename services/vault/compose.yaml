configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8200"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE} # Name used within your Tailscale environment
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Serves HTTPS on the tailnet name, proxied to Vault on 127.0.0.1:8200
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234 # The <addr>:<port> for the healthz endpoint
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config # Config folder used to store Tailscale files
      - ./ts/state:/var/lib/tailscale # Tailscale requirement
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  # Application
  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE}
    command: server # Makes sure data is persisted
    user: root
    environment:
      - VAULT_API_ADDR=https://${SERVICE}.${TS_DOMAIN}
      - VAULT_ADDR=http://127.0.0.1:8200
      - SKIP_SETCAP=true # mlock is disabled in vault.hcl, so skip granting the mlock capability
    volumes:
      - ./${SERVICE}-data:/vault/file
      - ./vault.hcl:/vault/config/vault.hcl:ro
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
    healthcheck:
      # Healthy while running, even when sealed or uninitialised (those return 200 here)
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
