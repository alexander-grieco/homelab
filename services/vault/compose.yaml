# Vault. Reached over the tailnet as the Tailscale Service svc:vault
# (see tailscale.json); no Tailscale sidecar.
services:
  application:
    image: hashicorp/vault:latest # pin once running: docker exec app-vault vault version
    container_name: app-vault
    command: server
    user: root # entrypoint chowns /vault/file, then drops to the vault user
    environment:
      - SKIP_SETCAP=true # mlock is disabled in vault.hcl
      - VAULT_ADDR=http://127.0.0.1:8200 # for `docker exec app-vault vault ...`
    ports:
      - 127.0.0.1:8200:8200 # host loopback only; never the LAN
    volumes:
      - ./vault-data:/vault/file # encrypted Raft storage; back this up
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - ./plugins:/vault/plugins:ro
    healthcheck:
      # Healthy while running, even when sealed or uninitialised.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
